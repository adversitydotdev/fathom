# Mirrors `mise run verify`. CI does not use mise for tools: mise.toml pins
# only the claude CLI, so each job installs its own toolchain.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the ci-screenshots branch
      pull-requests: write # the screenshot diff comment
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm e2e
        id: e2e

      # main: refresh the baseline, only from a green run.
      # PRs (not forks, whose token is read-only): diff against it and comment.
      - name: Publish screenshots
        if: >-
          always() && (
            (github.event_name == 'push' && steps.e2e.outcome == 'success') ||
            (github.event_name == 'pull_request' && steps.e2e.outcome != 'skipped' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          )
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/publish-screenshots.sh

      - name: Summary
        if: always()
        run: |
          n=$(find e2e/.screenshots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### Screenshots: $n"
            echo "Download the \`screenshots\` artifact for every page in both themes, or \`playwright-report\` for traces of failures."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: web/e2e/.screenshots/
          if-no-files-found: ignore
          include-hidden-files: true  # e2e output dirs start with a dot
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/.report/
            web/e2e/.results/
          include-hidden-files: true
          retention-days: 14
