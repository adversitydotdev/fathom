# Local stand-ins for the production bindings in RFC 0003 section 9:
# Postgres for RDS, and an S3-compatible store for the evidence bucket.
#
#   docker compose up -d
#   OPENGRC_DATABASE_URL=postgresql+asyncpg://opengrc:opengrc@localhost:5432/opengrc \
#   OPENGRC_S3_ENDPOINT=http://localhost:9000 OPENGRC_S3_BUCKET=opengrc \
#   AWS_ACCESS_KEY_ID=opengrc AWS_SECRET_ACCESS_KEY=opengrc-secret uv run opengrc

name: opengrc

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: opengrc
      POSTGRES_PASSWORD: opengrc
      POSTGRES_DB: opengrc
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengrc -d opengrc"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opengrc
      MINIO_ROOT_PASSWORD: opengrc-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the private bucket, the way the CloudFormation stack does in prod.
  s3-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://s3:9000 opengrc opengrc-secret &&
             mc mb --ignore-existing local/opengrc &&
             mc anonymous set none local/opengrc"

volumes:
  postgres:
  s3:
