# Full local Fathom stack (RFC 0003 §2 & §9):
#   - Postgres 18 (organization store + auth tables)
#   - SeaweedFS S3 + bucket init (evidence & render blobs)
#   - Alembic migration runner
#   - Fathom FastAPI server (`http://localhost:8080`)
#   - Idempotent local dev seeder (pulls ogrl-library v0.4.1 + starter Acme Platform;
#     set `FATHOM_SKIP_SEED=true` to boot an empty workspace)
#   - Fathom Next.js Web UI (`http://localhost:3000`)
#   - Integrations (RFC 0005): the seeder installs the first-party Okta, AWS, and GitHub
#     releases. Connection secrets persist in the `secrets` volume.
#
# Quickstart:
#   docker compose up --build
#   open http://localhost:3000
#
# AWS connections assume your read-only role with the credentials in AWS_* when compose
# starts. With an `aws login` session:
#   eval "$(aws configure export-credentials --format env)" && docker compose up -d api

name: fathom

x-api-env: &api-env
  FATHOM_DATABASE_URL: postgresql://fathom:fathom@postgres:5432/fathom
  FATHOM_S3_ENDPOINT: http://s3:8333
  FATHOM_S3_BUCKET: fathom
  FATHOM_S3_ACCESS_KEY_ID: fathom
  FATHOM_S3_SECRET_ACCESS_KEY: fathom-secret
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # For AWS connections only: the identity that assumes each connection's role.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  # Integrations (RFC 0005). Releases are unsigned until the registry ships.
  FATHOM_ALLOW_LOCAL_INTEGRATIONS: "true"
  FATHOM_SECRETS_FILE: /var/lib/fathom/secrets.json
  FATHOM_PUBLIC_URL: http://localhost:8080
  FATHOM_RUN_SCHEDULER: "true"
  FATHOM_API_TOKENS: '{"fathom_pat_local_dev_admin":{"actor_id":"party--local-admin","roles":["administrator"],"kind":"person"}}'
  FATHOM_ALLOWED_ORIGINS: http://localhost:3000
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  FATHOM_AI_MODEL: ${FATHOM_AI_MODEL:-}
  FATHOM_AI_BASE_URL: ${FATHOM_AI_BASE_URL:-}
  FATHOM_AI_API_KEY: ${FATHOM_AI_API_KEY:-}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fathom
      POSTGRES_PASSWORD: fathom
      POSTGRES_DB: fathom
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fathom -d fathom"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.53
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3:/data
      - ./deploy/local/s3.json:/etc/seaweedfs/s3.json:ro

  # Creates the private bucket, the way the CloudFormation stack does in prod.
  s3-bucket:
    image: amazon/aws-cli:2.27.0
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: fathom
      AWS_SECRET_ACCESS_KEY: fathom-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "for i in $$(seq 1 30); do
               aws --endpoint-url http://s3:8333 s3api head-bucket --bucket fathom 2>/dev/null && exit 0;
               aws --endpoint-url http://s3:8333 s3api create-bucket --bucket fathom && exit 0;
               sleep 1;
             done; exit 1"

  migrate:
    image: fathom-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: fathom-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-bucket:
        condition: service_completed_successfully
    environment: *api-env
    volumes:
      - secrets:/var/lib/fathom
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 15

  seed:
    image: fathom-api:local
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    environment:
      FATHOM_API_ORIGIN: http://api:8080
      FATHOM_API_TOKEN: fathom_pat_local_dev_admin
      FATHOM_SKIP_SEED: ${FATHOM_SKIP_SEED:-false}
    volumes:
      - ./deploy/local/seed.py:/app/seed.py:ro
    command: ["python", "/app/seed.py"]
    restart: "no"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        FATHOM_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      FATHOM_API_ORIGIN: http://api:8080
      FATHOM_API_TOKEN: fathom_pat_local_dev_admin
    ports:
      - "3000:3000"

volumes:
  postgres:
  s3:
  secrets:
