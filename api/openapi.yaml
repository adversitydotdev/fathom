        select:
          type: string
          description: CEL over `item`.
        assert:
          type: string
          description: CEL over `item`.
        aggregate:
          type: string
          description: CEL over `items`.
        subject:
          type: string
        allow_empty:
          type: boolean
        check:
          type: string
          examples: [dev.adversity.github/branch-protection@1]
        sources:
          type: array
          items:
            type: string
        with:
          type: object
          additionalProperties:
            type: string
