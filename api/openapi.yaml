  /exports/git:
    post:
      tags: [Jobs]
      operationId: exportGit
      summary: Write the organization snapshot to the configured git remote.
      description: RFC 0002 section 8. Returns a job. The database is not updated from the remote.
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The remote has commits this job did not write.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /restore:
    post:
      tags: [Jobs]
      operationId: restoreOrganization
      summary: Load an organization snapshot into an empty database.
      description: |
        RFC 0002 section 8.1. Runs once, into a database with no organization
        objects. There is no merge. Returns a job, whose error names the object
        that failed the graph check when the snapshot is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The database already holds organization objects.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/JobType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get one job.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{id}/files/{filename}:
    get:
      tags: [Jobs]
      operationId: getJobFile
      summary: Download one file a succeeded render job produced.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job has not succeeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /connectors:
    get:
      tags: [Connectors]
      operationId: listConnectors
      summary: List connectors installed in this deployment.
      description: |
        The registry is empty until a connector is installed beside the API.
        This is not a catalog of cloud products. RFC 0003 defines the port.
      responses:
        "200":
          description: The installed connectors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connector"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connectors/{id}/jobs:
    post:
      tags: [Connectors]
      operationId: runConnector
      summary: Ask a connector to collect evidence.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system_id:
                  type: string
                component_id:
                  type: string
                implementation_id:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A bearer token for this deployment. How a token is issued, and which
        organization it selects, is a later revision. RFC 0004 open question 1.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`.
      schema:
        type: string
    revoked:
      name: revoked
      in: query
      description: When true, return revoked objects. Default false.
      schema:
        type: boolean
        default: false
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: The object's current `modified` timestamp.
      schema:
        type: string
  responses:
    AcceptedJob:
      description: The work was accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    BadRequest:
      description: The request violates the schema or a graph constraint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No usable bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The id is taken, or the object is a library or provider row.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match does not equal `modified`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The upload is not an accepted media type.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URN such as `urn:ogrl:problem:library-object`.
          examples: ["urn:ogrl:problem:bad-request"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [detail]
            properties:
              pointer:
                type: string
                description: JSON pointer to the field.
              detail:
                type: string
    Page:
      type: object
      properties:
        next_cursor:
          type: string
        limit:
          type: integer
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    LibraryPin:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          examples: ["bundle--ogrl-library"]
        version:
          type: string
        commit:
          type: string
    LibraryPullRequest:
      type: object
      description: Provide `version` or `commit`.
      properties:
        version:
          type: string
        commit:
          type: string
    ProviderPin:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
        kind:
          type: string
          enum: [ogrl, oscal-component]
    ProviderImportRequest:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [ogrl, oscal-component]
        url:
          type: string
          format: uri
        version:
          type: string
        digest:
          type: string
    RestoreRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: A git remote holding a snapshot, or the URL of an exchange-form bundle.
        commit:
          type: string
          description: The snapshot commit, when `url` is a git remote. Defaults to the head of the default branch.
    JobType:
      type: string
      enum: [library_pull, provider_import, test_run, render, git_export, restore, connector]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    Job:
      type: object
      required: [id, type, status, created]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        created:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/Problem"
        result_id:
          type: string
          description: Set when the job produced one object, such as a result.
        files:
          type: array
          description: Names downloadable from `/jobs/{id}/files/{filename}` after a render succeeds.
          items:
            type: string
    JobPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        page:
          $ref: "#/components/schemas/Page"
    Connector:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    RenderRequest:
      type: object
      required: [view]
      properties:
        view:
          type: string
          enum: [oscal, ssp]
          description: "`oscal` is the package in RFC 0002 section 9. `ssp` is the narrative walk in RFC 0001 section 8.1."
        framework_id:
          type: string
          description: Required when `view` is `oscal`.
    ExternalReference:
      type: object
      properties:
        source:
          type: string
        url:
          type: string
        description:
          type: string
    Resource:
      type: object
      properties:
        uri:
          type: string
        media_type:
          type: string
        digest:
          type: object
          required: [algorithm, value]
          properties:
            algorithm:
              type: string
              const: sha-256
            value:
              type: string
    Envelope:
      type: object
      required: [type, id, spec_version, created, modified]
      properties:
        type:
          type: string
        id:
          type: string
        spec_version:
          type: string
          const: 0.1.0
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        name:
          type: string
        revoked:
          type: boolean
        created_by_ref:
          type: string
        tags:
          type: array
          items:
            type: string
        external_references:
          type: array
          items:
            $ref: "#/components/schemas/ExternalReference"
        extensions:
          type: object
          additionalProperties: true
        lang:
          type: string
    EnvelopeWrite:
      type: object
      description: Optional envelope fields every create and update accepts beside the fields of its type.
      properties:
        tags:
          type: array
          items:
            type: string
        external_references:
          type: array
          items:
            $ref: "#/components/schemas/ExternalReference"
        extensions:
          type: object
          additionalProperties: true
        lang:
          type: string
    Framework:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, publisher, version, reproduction]
          properties:
            publisher:
              type: string
            version:
              type: string
            reproduction:
              type: string
              enum: [permitted, citation-only]
            source:
              type: object
              properties:
                format:
                  type: string
                uri:
                  type: string
                path:
                  type: string
                commit:
                  type: string
    FrameworkPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Framework"
        page:
          $ref: "#/components/schemas/Page"
    RequirementClass:
      type: string
      enum: [criterion, control, enhancement, clause, specification]
    Requirement:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, framework_ref, class]
          properties:
            display_id:
              type: string
            framework_ref:
              type: string
            class:
              $ref: "#/components/schemas/RequirementClass"
            withdrawn:
              type: boolean
              default: false
              description: The publisher retired the obligation. Not the same as `revoked`.
            statement:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: object
                properties:
                  label:
                    type: string
            parts:
              type: array
              items:
                type: object
                required: [id, statement]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  statement:
                    type: string
            objectives:
              type: array
              items:
                type: object
                required: [id, statement]
                properties:
                  id:
                    type: string
                  statement:
                    type: string
                  methods:
                    type: array
                    items:
                      type: object
                      required: [method]
                      properties:
                        method:
                          type: string
                          enum: [examine, interview, test]
                        statement:
                          type: string
    RequirementPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        page:
          $ref: "#/components/schemas/Page"
    Origin:
      type: string
      enum: [standard, custom]
    Control:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, origin, statement, objective]
          properties:
            display_id:
              type: string
            origin:
              $ref: "#/components/schemas/Origin"
            family:
              type: string
            control_type:
              type: string
              enum: [preventive, detective, corrective]
            frequency:
              type: string
              enum: [continuous, daily, weekly, monthly, quarterly, annual, event-driven]
            summary:
              type: string
            statement:
              type: string
            objective:
              type: string
            guidance:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: string
    ControlWrite:
      type: object
      required: [name, statement, objective]
      properties:
        id:
          type: string
        name:
          type: string
        display_id:
          type: string
        family:
          type: string
        control_type:
          type: string
          enum: [preventive, detective, corrective]
        frequency:
          type: string
          enum: [continuous, daily, weekly, monthly, quarterly, annual, event-driven]
        summary:
          type: string
        statement:
          type: string
        objective:
          type: string
        guidance:
          type: string
        parameters:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
    ControlPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Control"
        page:
          $ref: "#/components/schemas/Page"
    Relationship:
      type: string
      enum: [equal-to, equivalent-to, subset-of, superset-of, intersects-with, no-relationship]
    ReviewStatus:
      type: string
      enum: [draft, reviewed]
    Mapping:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [source_ref, target_ref, relationship]
          properties:
            source_ref:
              type: string
            target_ref:
              type: string
            relationship:
              $ref: "#/components/schemas/Relationship"
            rationale:
              type: string
              enum: [functional, semantic, syntactic]
            review_status:
              $ref: "#/components/schemas/ReviewStatus"
            confidence:
              type: string
              enum: [low, medium, high]
            summary:
              type: string
            parameter_map:
              type: object
              additionalProperties:
                type: string
            combined_with_refs:
              type: array
              description: Mappings to the same target that, with this one, cover it. RFC 0001 section 7.4.
              items:
                type: string
    MappingWrite:
      type: object
      required: [source_ref, target_ref, relationship]
      properties:
        id:
          type: string
        source_ref:
          type: string
        target_ref:
          type: string
        relationship:
          $ref: "#/components/schemas/Relationship"
        rationale:
          type: string
          enum: [functional, semantic, syntactic]
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        confidence:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        parameter_map:
          type: object
          additionalProperties:
            type: string
        combined_with_refs:
          type: array
          items:
            type: string
    MappingPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Mapping"
        page:
          $ref: "#/components/schemas/Page"
    Baseline:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name]
          properties:
            extends_ref:
              type: string
              description: A baseline with no `extends_ref` of its own.
            framework_refs:
              type: array
              items:
                type: string
            control_refs:
              type: array
              items:
                type: string
            requirement_refs:
              type: array
              description: Requirements in scope. Omitted means every non-revoked requirement of `framework_refs`.
              items:
                type: string
            parameter_bindings:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: string
    BaselineWrite:
      type: object
      required: [name]
      properties:
        id:
          type: string
        name:
          type: string
        extends_ref:
          type: string
        framework_refs:
          type: array
          items:
            type: string
        control_refs:
          type: array
          items:
            type: string
        requirement_refs:
          type: array
          items:
            type: string
        parameter_bindings:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    EffectiveBaseline:
      type: object
      required: [baseline_id, framework_ids, control_ids, requirement_ids, parameter_bindings]
      properties:
        baseline_id:
          type: string
        extends_id:
          type: string
        framework_ids:
          type: array
          items:
            type: string
        control_ids:
          type: array
          items:
            type: string
        requirement_ids:
          type: array
          description: Every requirement in scope, listed out even when the baseline names none.
          items:
            type: string
        parameter_bindings:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    BaselinePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Baseline"
        page:
          $ref: "#/components/schemas/Page"
    TestMethod:
      type: string
      enum: [automated, manual]
    Test:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, control_ref, method]
          properties:
            control_ref:
              type: string
            fulfills_ref:
              type: string
            system_refs:
              type: array
              description: Systems this test checks. Omitted means every system.
              items:
                type: string
            objective_refs:
              type: array
              items:
                type: string
            method:
              $ref: "#/components/schemas/TestMethod"
            interval:
              type: string
              enum: [continuous, daily, weekly, monthly, quarterly, annual, event-driven]
            required:
              type: boolean
              default: false
              description: Not read on a test that sets `fulfills_ref`.
            description:
              type: string
            procedure_ref:
              type: string
            run:
              $ref: "#/components/schemas/Run"
    Run:
      type: object
      required: [runner, command]
      properties:
        runner:
          type: string
        command:
          type: string
        timeout:
          type: string
        env:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: object
            required: [path, name, media_type]
            properties:
              path:
                type: string
              name:
                type: string
              media_type:
                type: string
    TestWrite:
      type: object
      required: [name, control_ref, method]
      properties:
        id:
          type: string
        name:
          type: string
        control_ref:
          type: string
        fulfills_ref:
          type: string
        system_refs:
          type: array
          items:
            type: string
        objective_refs:
          type: array
          items:
            type: string
        method:
          $ref: "#/components/schemas/TestMethod"
        interval:
          type: string
        required:
          type: boolean
        description:
          type: string
        procedure_ref:
          type: string
        run:
          $ref: "#/components/schemas/Run"
    TestPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Test"
        page:
          $ref: "#/components/schemas/Page"
    PartyKind:
      type: string
      enum: [person, team, role, organization]
    Party:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, kind]
          properties:
            kind:
              $ref: "#/components/schemas/PartyKind"
    PartyWrite:
      type: object
      required: [name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/PartyKind"
    PartyPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Party"
        page:
          $ref: "#/components/schemas/Page"
    ComponentKind:
      type: string
      enum: [infrastructure, software, people, data, procedure, service]
    Component:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name, kind]
          properties:
            kind:
              $ref: "#/components/schemas/ComponentKind"
            description:
              type: string
            party_ref:
              type: string
    ComponentWrite:
      type: object
      required: [name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ComponentKind"
        description:
          type: string
        party_ref:
          type: string
    ComponentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        page:
          $ref: "#/components/schemas/Page"
    System:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [name]
          properties:
            function:
              type: string
            boundary:
              type: string
            component_refs:
              type: array
              items:
                type: string
            information_types:
              type: array
              items:
                $ref: "#/components/schemas/InformationType"
            parties:
              type: array
              items:
                $ref: "#/components/schemas/SystemParty"
    InformationType:
      type: object
      required: [name, confidentiality, integrity, availability]
      properties:
        name:
          type: string
        description:
          type: string
        confidentiality:
          $ref: "#/components/schemas/Impact"
        integrity:
          $ref: "#/components/schemas/Impact"
        availability:
          $ref: "#/components/schemas/Impact"
        component_refs:
          type: array
          items:
            type: string
    Impact:
      type: string
      enum: [low, moderate, high]
    SystemParty:
      type: object
      required: [party_ref, role]
      properties:
        party_ref:
          type: string
        role:
          type: string
          enum: [subservice, customer, operator]
        function:
          type: string
        authorization:
          type: object
          required: [identifier, authorized, expires]
          properties:
            identifier:
              type: string
            authorized:
              type: string
              format: date
            expires:
              type: string
              format: date
    SystemWrite:
      type: object
      required: [name]
      properties:
        id:
          type: string
        name:
          type: string
        function:
          type: string
        boundary:
          type: string
        component_refs:
          type: array
          items:
            type: string
        information_types:
          type: array
          items:
            $ref: "#/components/schemas/InformationType"
        parties:
          type: array
          items:
            $ref: "#/components/schemas/SystemParty"
    SystemPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/System"
        page:
          $ref: "#/components/schemas/Page"
    Program:
      allOf:
        - $ref: "#/components/schemas/Envelope"
