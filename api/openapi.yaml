openapi: 3.1.0
info:
  title: OGRL API
  version: 0.1.0
  summary: HTTP API for one organization's OGRL program.
  description: |
    Resources are the objects in RFC 0001. Computed routes return views the
    kernel derives and does not store. The design notes, including how Vanta,
    Drata, Secureframe, and Paramify map onto these routes, are in RFC 0004.

    Library objects and imported provider objects are readable here and are
    not editable. Revoke with `POST /{collection}/{id}/revoke`. There is no
    DELETE. A write sends `If-Match` set to the object's current `modified`
    value.

    Long operations return 202 and a job. Poll `GET /jobs/{id}`.

    Every `*Write` body also accepts the properties of `EnvelopeWrite`, and a
    property the server does not know is stored and returned unchanged.
  license:
    name: Apache-2.0
servers:
  - url: https://{host}/v1
    variables:
      host:
        default: localhost:8080
tags:
  - name: Meta
  - name: Library
  - name: Frameworks
  - name: Requirements
  - name: Controls
  - name: Mappings
  - name: Baselines
  - name: Tests
  - name: Parties
  - name: Components
  - name: Systems
  - name: Programs
  - name: Implementations
  - name: Results
  - name: Evidence
  - name: Findings
  - name: Policies
  - name: Procedures
  - name: Risks
  - name: Exceptions
  - name: Mapping reviews
  - name: Providers
  - name: Jobs
  - name: Connectors
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Process health.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /library:
    get:
      tags: [Library]
      operationId: getLibrary
      summary: The pinned library revision.
      responses:
        "200":
          description: The pin. Empty before the first pull.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /library/pull:
    post:
      tags: [Library]
      operationId: pullLibrary
      summary: Replace the library projection with one revision of this repository.
      description: RFC 0002 section 5. Returns a job. Organization objects are left in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryPullRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /frameworks:
    get:
      tags: [Frameworks]
      operationId: listFrameworks
      summary: List frameworks in the pinned library.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of frameworks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frameworks/{id}:
    get:
      tags: [Frameworks]
      operationId: getFramework
      summary: Get one framework.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The framework.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Framework"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /requirements:
    get:
      tags: [Requirements]
      operationId: listRequirements
      summary: List requirements.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: framework_id
          in: query
          schema:
            type: string
        - name: class
          in: query
          schema:
            $ref: "#/components/schemas/RequirementClass"
        - name: q
          in: query
          description: Case-insensitive match on name and display_id.
          schema:
            type: string
        - name: withdrawn
          in: query
          description: When true, include requirements the publisher withdrew. Default false.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /requirements/{id}:
    get:
      tags: [Requirements]
      operationId: getRequirement
      summary: Get one requirement, including parts, parameters, and objectives.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /requirements/{id}/mappings:
    get:
      tags: [Requirements]
      operationId: listRequirementMappings
      summary: Mappings whose target is this requirement.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /controls:
    get:
      tags: [Controls]
      operationId: listControls
      summary: List library and custom controls.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/Origin"
        - name: family
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of controls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Controls]
      operationId: createControl
      summary: Create a custom control.
      description: "`origin` is set to `custom`. A standard-library id is rejected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlWrite"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /controls/{id}:
    get:
      tags: [Controls]
      operationId: getControl
      summary: Get one control.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Controls]
      operationId: updateControl
      summary: Update a custom control.
      description: Library controls return 409. Arrays replace. `If-Match` is the current `modified` value.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /controls/{id}/revoke:
    post:
      tags: [Controls]
      operationId: revokeControl
      summary: Revoke a custom control.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "200":
          description: The revoked control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /controls/{id}/mappings:
    get:
      tags: [Controls]
      operationId: listControlMappings
      summary: Mappings whose source is this control.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /controls/{id}/tests:
    get:
      tags: [Controls]
      operationId: listControlTests
      summary: Tests of this control.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of tests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /controls/{id}/implementations:
    get:
      tags: [Controls]
      operationId: listControlImplementations
      summary: Implementations of this control.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: system_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of implementations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: List mappings.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: source_id
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          description: Requirement id. A part fragment is allowed.
          schema:
            type: string
        - name: relationship
          in: query
          schema:
            $ref: "#/components/schemas/Relationship"
        - name: review_status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Author an organization mapping.
      description: Does not modify a library mapping. Customer-facing coverage still requires a reviewed mapping, either here or through a mapping review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /mappings/{id}:
    get:
      tags: [Mappings]
      operationId: getMapping
      summary: Get one mapping.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Mappings]
      operationId: updateMapping
      summary: Update an organization mapping.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /mappings/{id}/revoke:
    post:
      tags: [Mappings]
      operationId: revokeMapping
      summary: Revoke an organization mapping.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "200":
          description: The revoked mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /baselines:
    get:
      tags: [Baselines]
      operationId: listBaselines
      summary: List library and organization baselines.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: extends_id
          in: query
          description: Baselines whose `extends_ref` is this baseline.
          schema:
            type: string
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of baselines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselinePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Baselines]
      operationId: createBaseline
      summary: Create an organization baseline.
      description: A standard-library id is rejected. `extends_ref` may name a library baseline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineWrite"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baseline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /baselines/{id}:
    get:
      tags: [Baselines]
      operationId: getBaseline
      summary: Get one baseline.
      description: The stored object. `extends_ref` is not applied.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The baseline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baseline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Baselines]
      operationId: updateBaseline
      summary: Update an organization baseline.
      description: Library baselines return 409. Arrays replace. `If-Match` is the current `modified` value.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baseline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /baselines/{id}/revoke:
    post:
      tags: [Baselines]
      operationId: revokeBaseline
      summary: Revoke an organization baseline.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "200":
          description: The revoked baseline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baseline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /baselines/{id}/effective:
    get:
      tags: [Baselines]
      operationId: getEffectiveBaseline
      summary: The baseline after `extends_ref` is applied.
      description: |
        RFC 0001 section 7.5. A computed view, not a stored object. This is
        the set of controls, requirements, and parameter bindings that program
        status is computed against.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The effective baseline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveBaseline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tests:
    get:
      tags: [Tests]
      operationId: listTests
      summary: List tests.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: control_id
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            $ref: "#/components/schemas/TestMethod"
        - name: required
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of tests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tests]
      operationId: createTest
      summary: Author an organization test.
      description: A library test is not created here. Use `fulfills_ref` to carry out a library test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /tests/{id}:
    get:
      tags: [Tests]
      operationId: getTest
      summary: Get one test.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tests]
      operationId: updateTest
      summary: Update an organization test.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /tests/{id}/revoke:
    post:
      tags: [Tests]
      operationId: revokeTest
      summary: Revoke an organization test.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "200":
          description: The revoked test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /tests/{id}/runs:
    post:
      tags: [Tests]
      operationId: runTest
      summary: Ask the harness to execute this test.
      description: |
        The test must have a `run` block the harness recognizes. A manual test
        is recorded with `POST /results` instead. The job's product is a result id.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [implementation_id]
              properties:
                implementation_id:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /parties:
    get:
      tags: [Parties]
      operationId: listParties
      summary: List parties.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/PartyKind"
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/revoked"
      responses:
        "200":
          description: A page of parties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Parties]
      operationId: createParty
      summary: Create a party.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /parties/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Parties]
      operationId: getParty
      summary: Get one party.
      responses:
        "200":
          description: The party.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Parties]
      operationId: updateParty
      summary: Update a party.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyWrite"
