[project]
name = "ogrl"
version = "0.1.0"
description = "OGRL kernel, API, job runner, and agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.127",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "ogrl-rs==0.1.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
ogrl-rs = [
    { url = "https://github.com/adversitydotdev/ogrl-rs/releases/download/v0.1.0/ogrl_rs-0.1.0-cp313-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/adversitydotdev/ogrl-rs/releases/download/v0.1.0/ogrl_rs-0.1.0-cp313-abi3-macosx_10_12_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { url = "https://github.com/adversitydotdev/ogrl-rs/releases/download/v0.1.0/ogrl_rs-0.1.0-cp313-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/adversitydotdev/ogrl-rs/releases/download/v0.1.0/ogrl_rs-0.1.0-cp313-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/adversitydotdev/ogrl-rs/releases/download/v0.1.0/ogrl_rs-0.1.0-cp313-abi3-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[project.scripts]
ogrl = "ogrl.main:run"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# RFC 0003 section 10 puts the package at the repository root, not under src/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]
