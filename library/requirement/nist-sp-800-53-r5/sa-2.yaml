parts:
  - id: a
    statement: >
      Determine the high-level information security and privacy requirements for
      the system or system service in mission and business process planning;
  - id: b
    statement: >
      Determine, document, and allocate the resources required to protect the
      system or system service as part of the organizational capital planning and
      investment control process; and
  - id: c
