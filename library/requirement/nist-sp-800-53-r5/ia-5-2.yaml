parts:
  - id: a
    statement: >
      For public key-based authentication:
  - id: a.1
    statement: >
      Enforce authorized access to the corresponding private key; and
  - id: a.2
    statement: >
      Map the authenticated identity to the account of the individual or group;
      and
  - id: b
    statement: >
      When public key infrastructure (PKI) is used:
  - id: b.1
    statement: >
      Validate certificates by constructing and verifying a certification path to
