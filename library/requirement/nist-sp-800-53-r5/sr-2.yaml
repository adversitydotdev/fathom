parameters:
  sr_02_odp_01:
    label: "systems, system components, or system services"
  sr_02_odp_02:
    label: frequency
parts:
  - id: a
    statement: >
      Develop a plan for managing supply chain risks associated with the research
      and development, design, manufacturing, acquisition, delivery, integration,
      operations and maintenance, and disposal of the following systems, system
      components or system services: {{ sr_02_odp_01 }};
  - id: b
    statement: >
      Review and update the supply chain risk management plan {{ sr_02_odp_02 }}
      or as required, to address threat, organizational or environmental changes;
      and
  - id: c
    statement: >
      Protect the supply chain risk management plan from unauthorized disclosure
      and modification.
