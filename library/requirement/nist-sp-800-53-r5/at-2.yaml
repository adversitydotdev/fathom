parts:
  - id: a
    statement: >
      Provide security and privacy literacy training to system users (including
      managers, senior executives, and contractors):
  - id: a.1
    statement: >
      As part of initial training for new users and {{ at_2_prm_1 }} thereafter;
      and
  - id: a.2
    statement: >
      When required by system changes or following {{ at_2_prm_2 }};
  - id: b
    statement: >
      Employ the following techniques to increase the security and privacy
      awareness of system users {{ at_02_odp_05 }};
  - id: c
    statement: >
      Update literacy training and awareness content {{ at_02_odp_06 }} and
      following {{ at_02_odp_07 }} ; and
  - id: d
    statement: >
      Incorporate lessons learned from internal or external security incidents or
      breaches into literacy training and awareness techniques.
