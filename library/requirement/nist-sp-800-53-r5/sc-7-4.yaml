parts:
  - id: a
    statement: >
      Implement a managed interface for each external telecommunication service;
  - id: b
    statement: >
      Establish a traffic flow policy for each managed interface;
  - id: c
    statement: >
      Protect the confidentiality and integrity of the information being
      transmitted across each interface;
  - id: d
    statement: >
      Document each exception to the traffic flow policy with a supporting mission
      or business need and duration of that need;
  - id: e
    statement: >
      Review exceptions to the traffic flow policy {{ sc_07_04_odp }} and remove
      exceptions that are no longer supported by an explicit mission or business
      need;
  - id: f
    statement: >
      Prevent unauthorized exchange of control plane traffic with external
      networks;
  - id: g
    statement: >
      Publish information to enable remote networks to detect unauthorized control
      plane traffic from internal networks; and
  - id: h
    statement: >
      Filter unauthorized control plane traffic from external networks.
