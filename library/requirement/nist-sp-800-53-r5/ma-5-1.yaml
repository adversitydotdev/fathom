name: Individuals Without Appropriate Access
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
parameters:
  ma_05_01_odp:
    label: alternate controls
parts:
  - id: a
    statement: >
      Implement procedures for the use of maintenance personnel that lack
      appropriate security clearances or are not U.S. citizens, that include the
      following requirements:
  - id: a.1
    statement: >
      Maintenance personnel who do not have needed access authorizations,
      clearances, or formal access approvals are escorted and supervised during
      the performance of maintenance and diagnostic activities on the system by
      approved organizational personnel who are fully cleared, have appropriate
      access authorizations, and are technically qualified; and
  - id: a.2
    statement: >
      Prior to initiating maintenance or diagnostic activities by personnel who do
      not have needed access authorizations, clearances or formal access
      approvals, all volatile information storage components within the system are
      sanitized and all nonvolatile storage media are removed or physically
      disconnected from the system and secured; and
  - id: b
    statement: >
      Develop and implement {{ ma_05_01_odp }} in the event a system component
      cannot be sanitized, removed, or disconnected from the system.
