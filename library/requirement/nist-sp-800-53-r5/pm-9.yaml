  pm_09_odp:
    label: frequency
parts:
  - id: a
    statement: >
      Develops a comprehensive strategy to manage:
  - id: a.1
    statement: >
      Security risk to organizational operations and assets, individuals, other
      organizations, and the Nation associated with the operation and use of
      organizational systems; and
  - id: a.2
    statement: >
      Privacy risk to individuals resulting from the authorized processing of
      personally identifiable information;
  - id: b
    statement: >
      Implement the risk management strategy consistently across the organization;
      and
  - id: c
    statement: >
      Review and update the risk management strategy {{ pm_09_odp }} or as
      required, to address organizational changes.
