parts:
  - id: a
    statement: >
      Develop a contingency plan for the system that:
  - id: a.1
    statement: >
      Identifies essential mission and business functions and associated
      contingency requirements;
  - id: a.2
    statement: >
      Provides recovery objectives, restoration priorities, and metrics;
  - id: a.3
    statement: >
      Addresses contingency roles, responsibilities, assigned individuals with
      contact information;
  - id: a.4
    statement: >
      Addresses maintaining essential mission and business functions despite a
      system disruption, compromise, or failure;
  - id: a.5
    statement: >
      Addresses eventual, full system restoration without deterioration of the
      controls originally planned and implemented;
  - id: a.6
    statement: >
      Addresses the sharing of contingency information; and
  - id: a.7
    statement: >
      Is reviewed and approved by {{ cp_2_prm_1 }};
  - id: b
    statement: >
      Distribute copies of the contingency plan to {{ cp_2_prm_2 }};
  - id: c
    statement: >
      Coordinate contingency planning activities with incident handling
      activities;
  - id: d
    statement: >
      Review the contingency plan for the system {{ cp_02_odp_05 }};
  - id: e
    statement: >
      Update the contingency plan to address changes to the organization, system,
      or environment of operation and problems encountered during contingency plan
      implementation, execution, or testing;
  - id: f
    statement: >
      Communicate contingency plan changes to {{ cp_2_prm_4 }};
  - id: g
    statement: >
      Incorporate lessons learned from contingency plan testing, training, or
      actual contingency activities into contingency testing and training; and
  - id: h
    statement: >
      Protect the contingency plan from unauthorized disclosure and modification.
