name: Formal Correspondence
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Require the developer of the system, system component, or system service to:
parts:
  - id: a
    statement: >
      Produce, as an integral part of the development process, a formal top-level
      specification that specifies the interfaces to security-relevant hardware,
      software, and firmware in terms of exceptions, error messages, and effects;
  - id: b
    statement: >
      Show via proof to the extent feasible with additional informal demonstration
      as necessary, that the formal top-level specification is consistent with the
      formal policy model;
  - id: c
    statement: >
      Show via informal demonstration, that the formal top-level specification
      completely covers the interfaces to security-relevant hardware, software,
      and firmware;
  - id: d
    statement: >
      Show that the formal top-level specification is an accurate description of
      the implemented security-relevant hardware, software, and firmware; and
  - id: e
    statement: >
      Describe the security-relevant hardware, software, and firmware mechanisms
      not addressed in the formal top-level specification but strictly internal to
      the security-relevant hardware, software, and firmware.
