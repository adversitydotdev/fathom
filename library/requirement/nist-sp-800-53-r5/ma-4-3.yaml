display_id: "MA-4(3)"
name: Comparable Security and Sanitization
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
parts:
  - id: a
    statement: >
      Require that nonlocal maintenance and diagnostic services be performed from
      a system that implements a security capability comparable to the capability
      implemented on the system being serviced; or
  - id: b
    statement: >
      Remove the component to be serviced from the system prior to nonlocal
      maintenance or diagnostic services; sanitize the component (for
      organizational information); and after the service is performed, inspect and
      sanitize the component (for potentially malicious software) before
      reconnecting the component to the system.
