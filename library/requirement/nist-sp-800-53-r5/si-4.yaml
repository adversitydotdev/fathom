parts:
  - id: a
    statement: >
      Monitor the system to detect:
  - id: a.1
    statement: >
      Attacks and indicators of potential attacks in accordance with the following
      monitoring objectives: {{ si_04_odp_01 }} ; and
  - id: a.2
    statement: >
      Unauthorized local, network, and remote connections;
  - id: b
    statement: >
      Identify unauthorized use of the system through the following techniques and
      methods: {{ si_04_odp_02 }};
  - id: c
    statement: >
      Invoke internal monitoring capabilities or deploy monitoring devices:
  - id: c.1
    statement: >
      Strategically within the system to collect organization-determined essential
      information; and
  - id: c.2
    statement: >
      At ad hoc locations within the system to track specific types of
      transactions of interest to the organization;
  - id: d
    statement: >
      Analyze detected events and anomalies;
  - id: e
    statement: >
      Adjust the level of system monitoring activity when there is a change in
      risk to organizational operations and assets, individuals, other
      organizations, or the Nation;
  - id: f
    statement: >
      Obtain legal opinion regarding system monitoring activities; and
  - id: g
    statement: >
      Provide {{ si_04_odp_03 }} to {{ si_04_odp_04 }} {{ si_04_odp_05 }}.
