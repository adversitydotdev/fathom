display_id: PM-21
name: Accounting of Disclosures
framework_ref: framework--nist-sp-800-53-r5
class: control
parts:
  - id: a
    statement: >
      Develop and maintain an accurate accounting of disclosures of personally
      identifiable information, including:
  - id: a.1
    statement: >
      Date, nature, and purpose of each disclosure; and
  - id: a.2
    statement: >
      Name and address, or other contact information of the individual or
      organization to which the disclosure was made;
  - id: b
    statement: >
      Retain the accounting of disclosures for the length of the time the
      personally identifiable information is maintained or five years after the
      disclosure is made, whichever is longer; and
  - id: c
    statement: >
      Make the accounting of disclosures available to the individual to whom the
      personally identifiable information relates upon request.
