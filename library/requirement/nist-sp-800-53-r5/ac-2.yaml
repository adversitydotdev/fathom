parts:
  - id: a
    statement: >
      Define and document the types of accounts allowed and specifically
      prohibited for use within the system;
  - id: b
    statement: >
      Assign account managers;
  - id: c
    statement: >
      Require {{ ac_02_odp_01 }} for group and role membership;
  - id: d
    statement: >
      Specify:
  - id: d.1
    statement: >
      Authorized users of the system;
  - id: d.2
    statement: >
      Group and role membership; and
  - id: d.3
    statement: >
      Access authorizations (i.e., privileges) and {{ ac_02_odp_02 }} for each
      account;
  - id: e
    statement: >
      Require approvals by {{ ac_02_odp_03 }} for requests to create accounts;
  - id: f
    statement: >
      Create, enable, modify, disable, and remove accounts in accordance with
      {{ ac_02_odp_04 }};
  - id: g
    statement: >
      Monitor the use of accounts;
  - id: h
    statement: >
      Notify account managers and {{ ac_02_odp_05 }} within:
  - id: h.1
    statement: >
      {{ ac_02_odp_06 }} when accounts are no longer required;
  - id: h.2
    statement: >
      {{ ac_02_odp_07 }} when users are terminated or transferred; and
  - id: h.3
    statement: >
      {{ ac_02_odp_08 }} when system usage or need-to-know changes for an
      individual;
  - id: i
    statement: >
      Authorize access to the system based on:
  - id: i.1
    statement: >
      A valid access authorization;
  - id: i.2
    statement: >
      Intended system usage; and
  - id: i.3
    statement: >
      {{ ac_02_odp_09 }};
  - id: j
    statement: >
      Review accounts for compliance with account management requirements
      {{ ac_02_odp_10 }};
  - id: k
    statement: >
      Establish and implement a process for changing shared or group account
      authenticators (if deployed) when individuals are removed from the group;
      and
  - id: l
    statement: >
      Align account management processes with personnel termination and transfer
      processes.
