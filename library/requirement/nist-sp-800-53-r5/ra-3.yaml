parts:
  - id: a
    statement: >
      Conduct a risk assessment, including:
  - id: a.1
    statement: >
      Identifying threats to and vulnerabilities in the system;
  - id: a.2
    statement: >
      Determining the likelihood and magnitude of harm from unauthorized access,
      use, disclosure, disruption, modification, or destruction of the system, the
      information it processes, stores, or transmits, and any related information;
      and
  - id: a.3
    statement: >
      Determining the likelihood and impact of adverse effects on individuals
      arising from the processing of personally identifiable information;
  - id: b
    statement: >
      Integrate risk assessment results and risk management decisions from the
      organization and mission or business process perspectives with system-level
      risk assessments;
  - id: c
    statement: >
      Document risk assessment results in {{ ra_03_odp_01 }};
  - id: d
    statement: >
      Review risk assessment results {{ ra_03_odp_03 }};
  - id: e
    statement: >
      Disseminate risk assessment results to {{ ra_03_odp_04 }} ; and
  - id: f
    statement: >
      Update the risk assessment {{ ra_03_odp_05 }} or when there are significant
      changes to the system, its environment of operation, or other conditions
      that may impact the security or privacy state of the system.
