name: Personally Identifiable Information Quality Management
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  Develop and document organization-wide policies and procedures for:
parts:
  - id: a
    statement: >
      Reviewing for the accuracy, relevance, timeliness, and completeness of
      personally identifiable information across the information life cycle;
  - id: b
    statement: >
      Correcting or deleting inaccurate or outdated personally identifiable
      information;
  - id: c
    statement: >
      Disseminating notice of corrected or deleted personally identifiable
      information to individuals or other appropriate entities; and
  - id: d
    statement: >
      Appeals of adverse decisions on correction or deletion requests.
