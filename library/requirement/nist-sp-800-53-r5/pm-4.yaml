display_id: PM-4
name: Plan of Action and Milestones Process
framework_ref: framework--nist-sp-800-53-r5
class: control
parts:
  - id: a
    statement: >
      Implement a process to ensure that plans of action and milestones for the
      information security, privacy, and supply chain risk management programs and
      associated organizational systems:
  - id: a.1
    statement: >
      Are developed and maintained;
  - id: a.2
    statement: >
      Document the remedial information security, privacy, and supply chain risk
      management actions to adequately respond to risk to organizational
      operations and assets, individuals, other organizations, and the Nation; and
  - id: a.3
    statement: >
      Are reported in accordance with established reporting requirements.
  - id: b
    statement: >
      Review plans of action and milestones for consistency with the
      organizational risk management strategy and organization-wide priorities for
      risk response actions.
