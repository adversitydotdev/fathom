name: System of Records Notice
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  For systems that process information that will be maintained in a Privacy
  Act system of records:
parts:
  - id: a
    statement: >
      Draft system of records notices in accordance with OMB guidance and submit
      new and significantly modified system of records notices to the OMB and
      appropriate congressional committees for advance review;
  - id: b
    statement: >
      Publish system of records notices in the Federal Register; and
  - id: c
    statement: >
      Keep system of records notices accurate, up-to-date, and scoped in
      accordance with policy.
