display_id: SA-17
name: Developer Security and Privacy Architecture and Design
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  Require the developer of the system, system component, or system service to
  produce a design specification and security and privacy architecture that:
parts:
  - id: a
    statement: >
      Is consistent with the organization’s security and privacy architecture
      that is an integral part the organization’s enterprise architecture;
  - id: b
    statement: >
      Accurately and completely describes the required security and privacy
      functionality, and the allocation of controls among physical and logical
      components; and
  - id: c
    statement: >
      Expresses how individual security and privacy functions, mechanisms, and
      services work together to provide required security and privacy capabilities
      and a unified approach to protection.
