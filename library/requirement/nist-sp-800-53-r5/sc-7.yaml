parts:
  - id: a
    statement: >
      Monitor and control communications at the external managed interfaces to the
      system and at key internal managed interfaces within the system;
  - id: b
    statement: >
      Implement subnetworks for publicly accessible system components that are
      {{ sc_07_odp }} separated from internal organizational networks; and
  - id: c
    statement: >
      Connect to external networks or systems only through managed interfaces
      consisting of boundary protection devices arranged in accordance with an
      organizational security and privacy architecture.
