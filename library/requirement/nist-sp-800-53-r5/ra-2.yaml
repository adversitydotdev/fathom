parts:
  - id: a
    statement: >
      Categorize the system and information it processes, stores, and transmits;
  - id: b
    statement: >
      Document the security categorization results, including supporting
      rationale, in the security plan for the system; and
  - id: c
    statement: >
      Verify that the authorizing official or authorizing official designated
      representative reviews and approves the security categorization decision.
