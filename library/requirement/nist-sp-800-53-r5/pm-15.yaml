statement: >
  Establish and institutionalize contact with selected groups and associations
  within the security and privacy communities:
parts:
  - id: a
    statement: >
      To facilitate ongoing security and privacy education and training for
      organizational personnel;
  - id: b
    statement: >
      To maintain currency with recommended security and privacy practices,
      techniques, and technologies; and
  - id: c
    statement: >
      To share current security and privacy information, including threats,
      vulnerabilities, and incidents.
