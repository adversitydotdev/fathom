name: Process Requirements for Information Transfer
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  When transferring information between different security domains, the
  process that transfers information between filter pipelines:
parts:
  - id: a
    statement: >
      Does not filter message content;
  - id: b
    statement: >
      Validates filtering metadata;
  - id: c
    statement: >
      Ensures the content associated with the filtering metadata has successfully
      completed filtering; and
  - id: d
    statement: >
      Transfers the content to the destination filter pipeline.
