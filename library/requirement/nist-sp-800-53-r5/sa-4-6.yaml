display_id: "SA-4(6)"
name: Use of Information Assurance Products
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
parts:
  - id: a
    statement: >
      Employ only government off-the-shelf or commercial off-the-shelf information
      assurance and information assurance-enabled information technology products
      that compose an NSA-approved solution to protect classified information when
      the networks used to transmit the information are at a lower classification
      level than the information being transmitted; and
  - id: b
    statement: >
      Ensure that these products have been evaluated and/or validated by NSA or in
      accordance with NSA-approved procedures.
