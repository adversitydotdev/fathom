framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Include the following in the Incident Response Plan for breaches involving
  personally identifiable information:
parts:
  - id: a
    statement: >
      A process to determine if notice to individuals or other organizations,
      including oversight organizations, is needed;
  - id: b
    statement: >
      An assessment process to determine the extent of the harm, embarrassment,
      inconvenience, or unfairness to affected individuals and any mechanisms to
      mitigate such harms; and
  - id: c
    statement: >
      Identification of applicable privacy requirements.
