parts:
  - id: a
    statement: >
      Establish personnel security requirements, including security roles and
      responsibilities for external providers;
  - id: b
    statement: >
      Require external providers to comply with personnel security policies and
      procedures established by the organization;
  - id: c
    statement: >
      Document personnel security requirements;
  - id: d
    statement: >
      Require external providers to notify {{ ps_07_odp_01 }} of any personnel
      transfers or terminations of external personnel who possess organizational
      credentials and/or badges, or who have system privileges within
      {{ ps_07_odp_02 }} ; and
  - id: e
    statement: >
      Monitor provider compliance with personnel security requirements.
