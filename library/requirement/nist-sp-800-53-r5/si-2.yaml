parts:
  - id: a
    statement: >
      Identify, report, and correct system flaws;
  - id: b
    statement: >
      Test software and firmware updates related to flaw remediation for
      effectiveness and potential side effects before installation;
  - id: c
    statement: >
      Install security-relevant software and firmware updates within
      {{ si_02_odp }} of the release of the updates; and
  - id: d
    statement: >
      Incorporate flaw remediation into the organizational configuration
      management process.
