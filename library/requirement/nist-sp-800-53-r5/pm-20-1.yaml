name: "Privacy Policies on Websites, Applications, and Digital Services"
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Develop and post privacy policies on all external-facing websites, mobile
  applications, and other digital services, that:
parts:
  - id: a
    statement: >
      Are written in plain language and organized in a way that is easy to
      understand and navigate;
  - id: b
    statement: >
      Provide information needed by the public to make an informed decision about
      whether and how to interact with the organization; and
  - id: c
    statement: >
      Are updated whenever the organization makes a substantive change to the
      practices it describes and includes a time/date stamp to inform the public
      of the date of the most recent changes.
