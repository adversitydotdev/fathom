name: Maintenance Personnel
framework_ref: framework--nist-sp-800-53-r5
class: control
parts:
  - id: a
    statement: >
      Establish a process for maintenance personnel authorization and maintain a
      list of authorized maintenance organizations or personnel;
  - id: b
    statement: >
      Verify that non-escorted personnel performing maintenance on the system
      possess the required access authorizations; and
  - id: c
    statement: >
      Designate organizational personnel with required access authorizations and
      technical competence to supervise the maintenance activities of personnel
      who do not possess the required access authorizations.
