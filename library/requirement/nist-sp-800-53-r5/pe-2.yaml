    statement: >
      Develop, approve, and maintain a list of individuals with authorized access
      to the facility where the system resides;
  - id: b
    statement: >
      Issue authorization credentials for facility access;
  - id: c
    statement: >
      Review the access list detailing authorized facility access by individuals
      {{ pe_02_odp }} ; and
  - id: d
    statement: >
      Remove individuals from the facility access list when access is no longer
