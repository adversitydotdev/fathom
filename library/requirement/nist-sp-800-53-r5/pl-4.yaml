parts:
  - id: a
    statement: >
      Establish and provide to individuals requiring access to the system, the
      rules that describe their responsibilities and expected behavior for
      information and system usage, security, and privacy;
  - id: b
    statement: >
      Receive a documented acknowledgment from such individuals, indicating that
      they have read, understand, and agree to abide by the rules of behavior,
      before authorizing access to information and the system;
  - id: c
    statement: >
      Review and update the rules of behavior {{ pl_04_odp_01 }} ; and
  - id: d
    statement: >
      Require individuals who have acknowledged a previous version of the rules of
      behavior to read and re-acknowledge {{ pl_04_odp_02 }}.
