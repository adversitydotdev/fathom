name: Limits on Authorized Use
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Permit authorized individuals to use an external system to access the system
  or to process, store, or transmit organization-controlled information only
  after:
parts:
  - id: a
    statement: >
      Verification of the implementation of controls on the external system as
      specified in the organization’s security and privacy policies and security
      and privacy plans; or
  - id: b
    statement: >
      Retention of approved system connection or processing agreements with the
      organizational entity hosting the external system.
