    statement: >
      Authorizes the system to operate;
  - id: d
    statement: >
      Ensure that the authorizing official for common controls authorizes the use
      of those controls for inheritance by organizational systems;
  - id: e
    statement: >
      Update the authorizations {{ ca_06_odp }}.
