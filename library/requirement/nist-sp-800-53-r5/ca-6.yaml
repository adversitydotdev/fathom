    statement: >
      Assign a senior official as the authorizing official for the system;
  - id: b
    statement: >
      Assign a senior official as the authorizing official for common controls
      available for inheritance by organizational systems;
  - id: c
    statement: >
      Ensure that the authorizing official for the system, before commencing
      operations:
  - id: c.1
    statement: >
      Accepts the use of common controls inherited by the system; and
