name: Foreign Nationals
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Ensure that:
parts:
  - id: a
    statement: >
      Foreign nationals with appropriate security clearances are used to conduct
      maintenance and diagnostic activities on classified systems only when the
      systems are jointly owned and operated by the United States and foreign
      allied governments, or owned and operated solely by foreign allied
      governments; and
  - id: b
    statement: >
      Approvals, consents, and detailed operational conditions regarding the use
      of foreign nationals to conduct maintenance and diagnostic activities on
      classified systems are fully documented within Memoranda of Agreements.
