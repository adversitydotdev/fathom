display_id: RA-8
name: Privacy Impact Assessments
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  Conduct privacy impact assessments for systems, programs, or other
  activities before:
parts:
  - id: a
    statement: >
      Developing or procuring information technology that processes personally
      identifiable information; and
  - id: b
    statement: >
      Initiating a new collection of personally identifiable information that:
  - id: b.1
    statement: >
      Will be processed using information technology; and
  - id: b.2
    statement: >
      Includes personally identifiable information permitting the physical or
      virtual (online) contacting of a specific individual, if identical questions
      have been posed to, or identical reporting requirements imposed on, ten or
      more individuals, other than agencies, instrumentalities, or employees of
      the federal government.
