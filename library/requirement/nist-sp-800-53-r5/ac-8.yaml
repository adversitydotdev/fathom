display_id: AC-8
name: System Use Notification
framework_ref: framework--nist-sp-800-53-r5
class: control
parameters:
  ac_08_odp_01:
    label: system use notification
  ac_08_odp_02:
    label: conditions
parts:
  - id: a
    statement: >
      Display {{ ac_08_odp_01 }} to users before granting access to the system
      that provides privacy and security notices consistent with applicable laws,
      executive orders, directives, regulations, policies, standards, and
      guidelines and state that:
  - id: a.1
    statement: >
      Users are accessing a U.S. Government system;
  - id: a.2
    statement: >
      System usage may be monitored, recorded, and subject to audit;
  - id: a.3
    statement: >
      Unauthorized use of the system is prohibited and subject to criminal and
      civil penalties; and
  - id: a.4
    statement: >
      Use of the system indicates consent to monitoring and recording;
  - id: b
    statement: >
      Retain the notification message or banner on the screen until users
      acknowledge the usage conditions and take explicit actions to log on to or
      further access the system; and
  - id: c
    statement: >
      For publicly accessible systems:
  - id: c.1
    statement: >
      Display system use information {{ ac_08_odp_02 }} , before granting further
      access to the publicly accessible system;
  - id: c.2
    statement: >
      Display references, if any, to monitoring, recording, or auditing that are
      consistent with privacy accommodations for such systems that generally
      prohibit those activities; and
  - id: c.3
    statement: >
      Include a description of the authorized uses of the system.
