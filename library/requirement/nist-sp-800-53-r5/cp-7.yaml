name: Alternate Processing Site
framework_ref: framework--nist-sp-800-53-r5
class: control
parameters:
  cp_07_odp_01:
    label: system operations
  cp_07_odp_02:
    label: time period
parts:
  - id: a
    statement: >
      Establish an alternate processing site, including necessary agreements to
      permit the transfer and resumption of {{ cp_07_odp_01 }} for essential
      mission and business functions within {{ cp_07_odp_02 }} when the primary
      processing capabilities are unavailable;
  - id: b
    statement: >
      Make available at the alternate processing site, the equipment and supplies
      required to transfer and resume operations or put contracts in place to
      support delivery to the site within the organization-defined time period for
      transfer and resumption; and
  - id: c
    statement: >
      Provide controls at the alternate processing site that are equivalent to
      those at the primary site.
