display_id: IR-4
name: Incident Handling
framework_ref: framework--nist-sp-800-53-r5
class: control
parts:
  - id: a
    statement: >
      Implement an incident handling capability for incidents that is consistent
      with the incident response plan and includes preparation, detection and
      analysis, containment, eradication, and recovery;
  - id: b
    statement: >
      Coordinate incident handling activities with contingency planning
      activities;
  - id: c
    statement: >
      Incorporate lessons learned from ongoing incident handling activities into
      incident response procedures, training, and testing, and implement the
      resulting changes accordingly; and
  - id: d
    statement: >
      Ensure the rigor, intensity, scope, and results of incident handling
      activities are comparable and predictable across the organization.
