name: Mapping Integrity for Version Control
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  Require the developer of the system, system component, or system service to
  maintain the integrity of the mapping between the master build data
  describing the current version of security-relevant hardware, software, and
  firmware and the on-site master copy of the data for the current version.
