  - id: a
    statement: >
      Implement {{ si_03_odp_01 }} malicious code protection mechanisms at system
      entry and exit points to detect and eradicate malicious code;
  - id: b
    statement: >
      Automatically update malicious code protection mechanisms as new releases
      are available in accordance with organizational configuration management
      policy and procedures;
  - id: c
    statement: >
      Configure malicious code protection mechanisms to:
  - id: c.1
    statement: >
      Perform periodic scans of the system {{ si_03_odp_02 }} and real-time scans
      of files from external sources at {{ si_03_odp_03 }} as the files are
      downloaded, opened, or executed in accordance with organizational policy;
      and
  - id: c.2
    statement: >
      {{ si_03_odp_04 }} ; and send alert to {{ si_03_odp_06 }} in response to
      malicious code detection; and
  - id: d
    statement: >
      Address the receipt of false positives during malicious code detection and
      eradication and the resulting potential impact on the availability of the
      system.
