display_id: PT-8
name: Computer Matching Requirements
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  When a system or organization processes information for the purpose of
  conducting a matching program:
parts:
  - id: a
    statement: >
      Obtain approval from the Data Integrity Board to conduct the matching
      program;
  - id: b
    statement: >
      Develop and enter into a computer matching agreement;
  - id: c
    statement: >
      Publish a matching notice in the Federal Register;
  - id: d
    statement: >
      Independently verify the information produced by the matching program before
      taking adverse action against an individual, if required; and
  - id: e
    statement: >
      Provide individuals with notice and an opportunity to contest the findings
      before taking adverse action against an individual.
