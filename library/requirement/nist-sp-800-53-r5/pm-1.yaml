  pm_01_odp_01:
    label: frequency
  pm_01_odp_02:
    label: events
parts:
  - id: a
    statement: >
      Develop and disseminate an organization-wide information security program
      plan that:
  - id: a.1
    statement: >
      Provides an overview of the requirements for the security program and a
      description of the security program management controls and common controls
      in place or planned for meeting those requirements;
  - id: a.2
    statement: >
      Includes the identification and assignment of roles, responsibilities,
      management commitment, coordination among organizational entities, and
      compliance;
  - id: a.3
    statement: >
      Reflects the coordination among organizational entities responsible for
      information security; and
  - id: a.4
    statement: >
      Is approved by a senior official with responsibility and accountability for
      the risk being incurred to organizational operations (including mission,
      functions, image, and reputation), organizational assets, individuals, other
      organizations, and the Nation;
  - id: b
    statement: >
      Review and update the organization-wide information security program plan
      {{ pm_01_odp_01 }} and following {{ pm_01_odp_02 }} ; and
  - id: c
    statement: >
      Protect the information security program plan from unauthorized disclosure
      and modification.
