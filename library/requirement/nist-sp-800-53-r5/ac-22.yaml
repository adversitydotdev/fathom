    label: frequency
parts:
  - id: a
    statement: >
      Designate individuals authorized to make information publicly accessible;
  - id: b
    statement: >
      Train authorized individuals to ensure that publicly accessible information
      does not contain nonpublic information;
  - id: c
    statement: >
      Review the proposed content of information prior to posting onto the
      publicly accessible system to ensure that nonpublic information is not
      included; and
  - id: d
    statement: >
      Review the content on the publicly accessible system for nonpublic
      information {{ ac_22_odp }} and remove such information, if discovered.
