display_id: IA-5
name: Authenticator Management
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  Manage system authenticators by:
parameters:
  ia_05_odp_01:
    label: time period by authenticator type
  ia_05_odp_02:
    label: events
parts:
  - id: a
    statement: >
      Verifying, as part of the initial authenticator distribution, the identity
      of the individual, group, role, service, or device receiving the
      authenticator;
  - id: b
    statement: >
      Establishing initial authenticator content for any authenticators issued by
      the organization;
  - id: c
    statement: >
      Ensuring that authenticators have sufficient strength of mechanism for their
      intended use;
  - id: d
    statement: >
      Establishing and implementing administrative procedures for initial
      authenticator distribution, for lost or compromised or damaged
      authenticators, and for revoking authenticators;
  - id: e
    statement: >
      Changing default authenticators prior to first use;
  - id: f
    statement: >
      Changing or refreshing authenticators {{ ia_05_odp_01 }} or when
      {{ ia_05_odp_02 }} occur;
  - id: g
    statement: >
      Protecting authenticator content from unauthorized disclosure and
      modification;
  - id: h
    statement: >
      Requiring individuals to take, and having devices implement, specific
      controls to protect authenticators; and
  - id: i
    statement: >
      Changing authenticators for group or role accounts when membership to those
      accounts changes.
