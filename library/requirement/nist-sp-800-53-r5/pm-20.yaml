display_id: PM-20
name: Dissemination of Privacy Program Information
framework_ref: framework--nist-sp-800-53-r5
class: control
statement: >
  Maintain a central resource webpage on the organization’s principal public
  website that serves as a central source of information about the
  organization’s privacy program and that:
parts:
  - id: a
    statement: >
      Ensures that the public has access to information about organizational
      privacy activities and can communicate with its senior agency official for
      privacy;
  - id: b
    statement: >
      Ensures that organizational privacy practices and reports are publicly
      available; and
  - id: c
    statement: >
      Employs publicly facing email addresses and/or phone lines to enable the
      public to provide feedback and/or direct questions to privacy offices
      regarding privacy practices.
