name: Controlled Maintenance
framework_ref: framework--nist-sp-800-53-r5
class: control
parameters:
  ma_02_odp_01:
    label: personnel or roles
  ma_02_odp_02:
    label: information
  ma_02_odp_03:
    label: information
parts:
  - id: a
    statement: >
      Schedule, document, and review records of maintenance, repair, and
      replacement on system components in accordance with manufacturer or vendor
      specifications and/or organizational requirements;
  - id: b
    statement: >
      Approve and monitor all maintenance activities, whether performed on site or
      remotely and whether the system or system components are serviced on site or
      removed to another location;
  - id: c
    statement: >
      Require that {{ ma_02_odp_01 }} explicitly approve the removal of the system
      or system components from organizational facilities for off-site
      maintenance, repair, or replacement;
  - id: d
    statement: >
      Sanitize equipment to remove the following information from associated media
      prior to removal from organizational facilities for off-site maintenance,
      repair, or replacement: {{ ma_02_odp_02 }};
  - id: e
    statement: >
      Check all potentially impacted controls to verify that the controls are
      still functioning properly following maintenance, repair, or replacement
      actions; and
  - id: f
    statement: >
      Include the following information in organizational maintenance records:
      {{ ma_02_odp_03 }}.
