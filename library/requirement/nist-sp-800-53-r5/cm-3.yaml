parts:
  - id: a
    statement: >
      Determine and document the types of changes to the system that are
      configuration-controlled;
  - id: b
    statement: >
      Review proposed configuration-controlled changes to the system and approve
      or disapprove such changes with explicit consideration for security and
      privacy impact analyses;
  - id: c
    statement: >
      Document configuration change decisions associated with the system;
  - id: d
    statement: >
      Implement approved configuration-controlled changes to the system;
  - id: e
    statement: >
      Retain records of configuration-controlled changes to the system for
      {{ cm_03_odp_01 }};
  - id: f
    statement: >
      Monitor and review activities associated with configuration-controlled
      changes to the system; and
  - id: g
    statement: >
      Coordinate and provide oversight for configuration change control activities
      through {{ cm_03_odp_02 }} that convenes {{ cm_03_odp_03 }}.
