parts:
  - id: a
    statement: >
      Develop and document an inventory of system components that:
  - id: a.1
    statement: >
      Accurately reflects the system;
  - id: a.2
    statement: >
      Includes all components within the system;
  - id: a.3
    statement: >
      Does not include duplicate accounting of components or components assigned
      to any other system;
  - id: a.4
    statement: >
      Is at the level of granularity deemed necessary for tracking and reporting;
      and
  - id: a.5
    statement: >
      Includes the following information to achieve system component
      accountability: {{ cm_08_odp_01 }} ; and
  - id: b
    statement: >
      Review and update the system component inventory {{ cm_08_odp_02 }}.
