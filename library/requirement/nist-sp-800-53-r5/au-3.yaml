statement: >
  Ensure that audit records contain information that establishes the
  following:
parts:
  - id: a
    statement: >
      What type of event occurred;
  - id: b
    statement: >
      When the event occurred;
  - id: c
    statement: >
      Where the event occurred;
  - id: d
    statement: >
      Source of the event;
  - id: e
    statement: >
      Outcome of the event; and
  - id: f
    statement: >
      Identity of any individuals, subjects, or objects/entities associated with
      the event.
