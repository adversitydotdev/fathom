display_id: "IA-5(1)"
name: Password-based Authentication
framework_ref: framework--nist-sp-800-53-r5
class: enhancement
statement: >
  For password-based authentication:
parameters:
  ia_05_01_odp_01:
    label: frequency
  ia_05_01_odp_02:
    label: composition and complexity rules
parts:
  - id: a
    statement: >
      Maintain a list of commonly-used, expected, or compromised passwords and
      update the list {{ ia_05_01_odp_01 }} and when organizational passwords are
      suspected to have been compromised directly or indirectly;
  - id: b
    statement: >
      Verify, when users create or update passwords, that the passwords are not
      found on the list of commonly-used, expected, or compromised passwords in
      IA-5(1)(a);
  - id: c
    statement: >
      Transmit passwords only over cryptographically-protected channels;
  - id: d
    statement: >
      Store passwords using an approved salted key derivation function, preferably
      using a keyed hash;
  - id: e
    statement: >
      Require immediate selection of a new password upon account recovery;
  - id: f
    statement: >
      Allow user selection of long passwords and passphrases, including spaces and
      all printable characters;
  - id: g
    statement: >
      Employ automated tools to assist the user in selecting strong password
      authenticators; and
  - id: h
    statement: >
      Enforce the following composition and complexity rules:
      {{ ia_05_01_odp_02 }}.
