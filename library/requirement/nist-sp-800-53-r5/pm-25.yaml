parts:
  - id: a
    statement: >
      Develop, document, and implement policies and procedures that address the
      use of personally identifiable information for internal testing, training,
      and research;
  - id: b
    statement: >
      Limit or minimize the amount of personally identifiable information used for
      internal testing, training, and research purposes;
  - id: c
    statement: >
      Authorize the use of personally identifiable information when such
      information is required for internal testing, training, and research; and
