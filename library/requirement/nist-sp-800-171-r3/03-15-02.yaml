name: System Security Plan
framework_ref: framework--nist-sp-800-171-r3
class: control
parameters:
  a_03_15_02_odp_01:
    label: frequency
parts:
  - id: a
    statement: >
      Develop a system security plan that:
  - id: a.01
    statement: >
      Defines the constituent system components;
  - id: a.02
    statement: >
      Identifies the information types processed, stored, and transmitted by the
      system;
  - id: a.03
    statement: >
      Describes specific threats to the system that are of concern to the
      organization;
  - id: a.04
    statement: >
      Describes the operational environment for the system and any dependencies on
      or connections to other systems or system components;
  - id: a.05
    statement: >
      Provides an overview of the security requirements for the system;
  - id: a.06
    statement: >
      Describes the safeguards in place or planned for meeting the security
      requirements;
  - id: a.07
    statement: >
      Identifies individuals that fulfill system roles and responsibilities; and
  - id: a.08
    statement: >
      Includes other relevant information necessary for the protection of CUI.
  - id: b
    statement: >
      Review and update the system security plan {{ a_03_15_02_odp_01 }}.
  - id: c
    statement: >
      Protect the system security plan from unauthorized disclosure.
