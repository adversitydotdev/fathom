parts:
  - id: a
    statement: >
      Define the types of system accounts allowed and prohibited.
  - id: b
    statement: >
      Create, enable, modify, disable, and remove system accounts in accordance
      with policy, procedures, prerequisites, and criteria.
  - id: c
    statement: >
      Specify:
  - id: c.01
    statement: >
      Authorized users of the system,
  - id: c.02
    statement: >
      Group and role membership, and
  - id: c.03
    statement: >
      Access authorizations (i.e., privileges) for each account.
  - id: d
    statement: >
      Authorize access to the system based on:
  - id: d.01
    statement: >
      A valid access authorization and
  - id: d.02
    statement: >
      Intended system usage.
  - id: e
    statement: >
      Monitor the use of system accounts.
  - id: f
    statement: >
      Disable system accounts when:
  - id: f.01
    statement: >
      The accounts have expired,
  - id: f.02
    statement: >
      The accounts have been inactive for {{ a_03_01_01_odp_01 }},
  - id: f.03
    statement: >
      The accounts are no longer associated with a user or individual,
  - id: f.04
    statement: >
      The accounts are in violation of organizational policy, or
  - id: f.05
    statement: >
      Significant risks associated with individuals are discovered.
  - id: g
    statement: >
      Notify account managers and designated personnel or roles within:
  - id: g.01
    statement: >
      {{ a_03_01_01_odp_02 }} when accounts are no longer required.
  - id: g.02
    statement: >
      {{ a_03_01_01_odp_03 }} when users are terminated or transferred.
  - id: g.03
    statement: >
      {{ a_03_01_01_odp_04 }} when system usage or the need-to-know changes for an
      individual.
  - id: h
    statement: >
      Require that users log out of the system after {{ a_03_01_01_odp_05 }} of
      expected inactivity or when {{ a_03_01_01_odp_06 }}.
