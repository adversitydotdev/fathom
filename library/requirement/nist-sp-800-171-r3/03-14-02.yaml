parts:
  - id: a
    statement: >
      Implement malicious code protection mechanisms at system entry and exit
      points to detect and eradicate malicious code.
  - id: b
    statement: >
      Update malicious code protection mechanisms as new releases are available in
      accordance with configuration management policies and procedures.
  - id: c
    statement: >
      Configure malicious code protection mechanisms to:
  - id: c.01
    statement: >
      Perform scans of the system {{ a_03_14_02_odp_01 }} and real-time scans of
      files from external sources at endpoints or system entry and exit points as
      the files are downloaded, opened, or executed; and
  - id: c.02
    statement: >
      Block malicious code, quarantine malicious code, or take other mitigation
      actions in response to malicious code detection.
