parts:
  - id: a
    statement: >
      Verify the identity of the individual, group, role, service, or device
      receiving the authenticator as part of the initial authenticator
      distribution.
  - id: b
    statement: >
      Establish initial authenticator content for any authenticators issued by the
      organization.
  - id: c
    statement: >
      Establish and implement administrative procedures for initial authenticator
      distribution; for lost, compromised, or damaged authenticators; and for
      revoking authenticators.
  - id: d
    statement: >
      Change default authenticators at first use.
  - id: e
    statement: >
      Change or refresh authenticators {{ a_03_05_12_odp_01 }} or when the
      following events occur: {{ a_03_05_12_odp_02 }}.
  - id: f
    statement: >
      Protect authenticator content from unauthorized disclosure and modification.
