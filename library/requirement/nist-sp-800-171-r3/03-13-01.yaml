name: Boundary Protection
framework_ref: framework--nist-sp-800-171-r3
class: control
parts:
  - id: a
    statement: >
      Monitor and control communications at external managed interfaces to the
      system and key internal managed interfaces within the system.
  - id: b
    statement: >
      Implement subnetworks for publicly accessible system components that are
      physically or logically separated from internal networks.
  - id: c
    statement: >
      Connect to external systems only through managed interfaces that consist of
      boundary protection devices arranged in accordance with an organizational
      security architecture.
