name: Use of External Systems
framework_ref: framework--nist-sp-800-171-r3
class: control
parameters:
  a_03_01_20_odp_01:
    label: security requirements
parts:
  - id: a
    statement: >
      Prohibit the use of external systems unless the systems are specifically
      authorized.
  - id: b
    statement: >
      Establish the following security requirements to be satisfied on external
      systems prior to allowing use of or access to those systems by authorized
      individuals: {{ a_03_01_20_odp_01 }}.
  - id: c
    statement: >
      Permit authorized individuals to use external systems to access the
      organizational system or to process, store, or transmit CUI only after:
  - id: c.01
    statement: >
      Verifying that the security requirements on the external systems as
      specified in the organization’s system security plans have been satisfied
      and
  - id: c.02
    statement: >
      Retaining approved system connection or processing agreements with the
      organizational entities hosting the external systems.
  - id: d
    statement: >
      Restrict the use of organization-controlled portable storage devices by
      authorized individuals on external systems.
