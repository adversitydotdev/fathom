    statement: >
      Approve, control, and monitor the use of system maintenance tools.
  - id: b
    statement: >
      Check media with diagnostic and test programs for malicious code before it
      is used in the system.
  - id: c
    statement: >
      Prevent the removal of system maintenance equipment containing CUI by
