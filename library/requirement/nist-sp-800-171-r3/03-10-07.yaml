name: Physical Access Control
framework_ref: framework--nist-sp-800-171-r3
class: control
parts:
  - id: a
    statement: >
      Enforce physical access authorizations at entry and exit points to the
      facility where the system resides by:
  - id: a.01
    statement: >
      Verifying individual physical access authorizations before granting access
      to the facility and
  - id: a.02
    statement: >
      Controlling ingress and egress with physical access control systems,
      devices, or guards.
  - id: b
    statement: >
      Maintain physical access audit logs for entry or exit points.
  - id: c
    statement: >
      Escort visitors, and control visitor activity.
  - id: d
    statement: >
      Secure keys, combinations, and other physical access devices.
  - id: e
    statement: >
      Control physical access to output devices to prevent unauthorized
      individuals from obtaining access to CUI.
