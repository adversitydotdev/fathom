name: Incident Response Plan
framework_ref: framework--nist-sp-800-171-r3
class: control
parts:
  - id: a
    statement: >
      Develop an incident response plan that:
  - id: a.01
    statement: >
      Provides the organization with a roadmap for implementing its incident
      response capability,
  - id: a.02
    statement: >
      Describes the structure and organization of the incident response
      capability,
  - id: a.03
    statement: >
      Provides a high-level approach for how the incident response capability fits
      into the overall organization,
  - id: a.04
    statement: >
      Defines reportable incidents,
  - id: a.05
    statement: >
      Addresses the sharing of incident information, and
  - id: a.06
    statement: >
      Designates responsibilities to organizational entities, personnel, or roles.
  - id: b
    statement: >
      Distribute copies of the incident response plan to designated incident
      response personnel (identified by name and/or by role) and organizational
      elements.
  - id: c
    statement: >
      Update the incident response plan to address system and organizational
      changes or problems encountered during plan implementation, execution, or
      testing.
  - id: d
    statement: >
      Protect the incident response plan from unauthorized disclosure.
